[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fresnel-relay"
version = "0.1.0"
description = "Fresnel: the Lighthouse relay. Fetches, normalizes and serves situational-awareness data as JSON."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx[socks]>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
fresnel = "fresnel.cli:main"

[tool.setuptools.packages.find]
include = ["fresnel*"]

[tool.setuptools.package-data]
fresnel = ["templates/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["tests"]
