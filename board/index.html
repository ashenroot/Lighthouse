<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lighthouse</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Cpath d='M14 33 L16 14 H20 L22 33 Z M15.5 14 V10 H20.5 V14 M16.5 10 L18 6 L19.5 10' fill='none' stroke='%235fd0c0' stroke-width='2.5' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <header class="top">
    <div class="brand">
      <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M14 33 L16 14 H20 L22 33 Z"/><path d="M15.5 14 V10 H20.5 V14"/><path d="M16.5 10 L18 6 L19.5 10"/><path d="M12 33 H24"/><path d="M13 12 L4 9 M13 8 L4 5 M23 12 L32 9 M23 8 L32 5" opacity="0.6"/></svg>
      <div>
        <h1>LIGHTHOUSE</h1>
        <div class="muted" id="tagline">Watch the sky. Mind the rocks.</div>
      </div>
    </div>
    <div class="controls mono">
      <span class="chip" id="where">Loading…</span>
      <span class="chip" id="when"></span>
      <div class="chip seg" role="group" aria-label="Refresh interval">
        <span class="muted">Refresh</span>
        <span id="intervals"></span>
        <span class="muted" id="next"></span>
      </div>
      <button type="button" class="chip btn" id="refresh-now">Refresh now</button>
    </div>
  </header>

  <div id="banner" class="banner" role="status" hidden></div>

  <section aria-label="Status summary">
    <div class="eyebrow mono">Status · click a tile to show or hide its panel</div>
    <div class="tiles" id="tiles"></div>
  </section>

  <div class="eyebrow mono">Panels · drag a panel, or use the arrows, to rearrange</div>
  <main class="panels" id="panels"></main>

  <footer class="foot mono">
    <span id="relay-info"></span>
    <a href="https://github.com/ashenroot/Lighthouse" target="_blank" rel="noopener">Lighthouse on GitHub</a>
  </footer>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
